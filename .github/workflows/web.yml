name: web
on:
  push:
    branches:
      - main
    # a manifest change only needs argo cd, not a new image
    paths-ignore:
      - k8s/**
      - argocd/**

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout github
        uses: actions/checkout@v6

      # a broken pipeline script fails the run before anything is built or deployed
      - name: test the pipeline scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: build and push holidayfriend/web
        env:
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/holidayfriend/web
          GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_SIGN_IN_WEB_CLIENT_ID }}
          APPLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_APPLE_SIGN_IN_CLIENT_ID }}
        run: |
          IMAGE=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          docker buildx build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_GOOGLE_SIGN_IN_WEB_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --build-arg NEXT_PUBLIC_APPLE_SIGN_IN_CLIENT_ID="$APPLE_CLIENT_ID" \
            -t "$IMAGE:${GITHUB_SHA::7}" \
            -t "$IMAGE:latest" \
            . --push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout github
        uses: actions/checkout@v6
        with:
          # the full history tells whether this build is older than the deployed tag
          fetch-depth: 0

      - name: write the tag into the manifest
        run: python3 .github/scripts/deploy_tag.py
